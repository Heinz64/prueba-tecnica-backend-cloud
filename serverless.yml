service: prueba-tecnica-backend-cloud

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  httpApi:
    # Habilitado solo para poder probar desde client/index.html en local.
    # En un ambiente real esto se acota a los origenes del frontend real, no "*".
    cors: true
  environment:
    NODE_ENV: ${self:provider.stage}
    LOG_LEVEL: info
    DYNAMODB_TABLE: ${self:service}-${self:provider.stage}
    # En un ambiente real: referencia a un secreto en SSM/Secrets Manager, nunca en texto plano.
    JWT_SECRET: ${env:JWT_SECRET, 'dev-only-secret-do-not-use-in-prod'}
  iam:
    role:
      statements:
        # Principio de minimo privilegio: acotar a la tabla/recursos especificos, nunca "*".
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - !GetAtt AppTable.Arn
            - !Sub '${AppTable.Arn}/index/GSI1'

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20

functions:
  health:
    handler: src/handlers/health.handler
    events:
      - httpApi:
          path: /health
          method: get

  # Recurso de ejemplo "items" que recorre docs/BUENAS_PRACTICAS.md de punta a punta
  # (auth, validacion, idempotencia, paginacion, Query sin Scan, manejo de errores).
  # Se reemplaza/ajusta segun lo que pida el enunciado real de la prueba.
  createItem:
    handler: src/handlers/items.create
    events:
      - httpApi:
          path: /items
          method: post

  getItem:
    handler: src/handlers/items.getById
    events:
      - httpApi:
          path: /items/{id}
          method: get

  listItems:
    handler: src/handlers/items.list
    events:
      - httpApi:
          path: /items
          method: get

resources:
  Resources:
    AppTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
